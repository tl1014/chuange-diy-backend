server:
  port: 8080
  error:
    include-message: always

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chuange_diy}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

app:
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  generate-data:
    enabled: ${APP_GENERATE_DATA_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:chuange-diy-dev-secret-key-please-change-in-prod-2026}
    expire-hours: ${JWT_EXPIRE_HOURS:168}